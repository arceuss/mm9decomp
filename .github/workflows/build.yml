name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Private container from arceuss/mm9decomp-build: holds the retail DOL in
    # /game and the Wii/1.0 and GC/3.0a5 CodeWarrior installs in /compilers.
    container: ghcr.io/arceuss/mm9decomp-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [WR9E]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Normalize file mod times so the ninja cache below is reusable.
      - name: Restore timestamps
        run: |
          uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
              --merge --commit-time

      - name: Prepare
        run: cp -a /game .

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build
            .ninja_deps
            .ninja_log
          key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ matrix.version }}-

      # Plain `ninja` links the DOL and fails unless its SHA-1 matches retail.
      - name: Build
        run: |
          python configure.py --version ${{ matrix.version }} \
              --binutils /binutils --compilers /compilers
          ninja
          ninja progress build/${{ matrix.version }}/report.json

      # bytematch.dev reads this artifact from successful push runs on main.
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}_report
          path: build/${{ matrix.version }}/report.json
